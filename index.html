  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }

    body, html {
      overscroll-behavior: none;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 5px 5px;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0px 0px 5px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #ffffff;
      opacity: 1.0;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1.0;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #666666;
      color: #ffffff
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

  </style>

<body>

  <!-- KK_VIEW_START -->
<div id="presplash" hidden></div>
<main id="kkBoot" class="kk-boot" data-state="studio" aria-label="Memulai Kouseikan">

    <svg class="kk-thread" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M-70 711C122 500 299 949 496 708S909 86 1124 238S1131 746 1497 591"/><path class="kk-thread-faint" d="M-56 740C197 521 300 990 520 741S961 87 1150 273S1180 775 1490 626"/></svg>
    <span class="kk-spark kk-spark-one" aria-hidden="true">✦</span><span class="kk-spark kk-spark-two" aria-hidden="true">✧</span>
    <div class="kk-scrap kk-scrap-back" aria-hidden="true"></div>
    <article class="kk-paper">
      <span class="kk-tape" aria-hidden="true"></span>
      <span class="kk-holes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <p class="kk-eyebrow">SEBUAH CERITA DARI ZZZ</p>

      <p id="kkLoadingCaption" class="kk-caption" role="status" aria-live="polite">Menyiapkan panggung cerita…</p>
      <div id="kkProgress" class="kk-progress is-indeterminate" role="progressbar" aria-label="Proses memuat cerita" aria-valuemin="0" aria-valuemax="100"><span id="kkProgressFill"></span><i class="kk-progress-star" aria-hidden="true">✦</i></div>

  <div id="ContextContainer">

      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style=display:none></input>
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">Import Saves</a>
      <a href="javascript:onSavegamesExport();">Export Saves</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">Download Log</a>
      <a href="https://www.renpy.org/" target="_blank">
          Powered by Ren'Py
      </a>
      </span>

  <div id="statusDiv" class="hidden">

      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>

  <script>
      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip';

      // Register the service worker.
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' });
          }
      }

      // Di HP: begitu pemain menyentuh layar pertama kali (biasanya untuk mulai
      // membaca dialog), masuk ke mode fullscreen + kunci landscape sekalian.
      // Browser melarang fullscreen/orientation-lock otomatis tanpa sentuhan
      // pemain, jadi ini dipasang di sentuhan PERTAMA supaya terasa otomatis.
      if (window.matchMedia('(pointer: coarse)').matches) {
          var kkGoImmersive = function () {
              var el = document.documentElement;
              var req = el.requestFullscreen || el.webkitRequestFullscreen ||
                        el.mozRequestFullScreen || el.msRequestFullscreen;
              if (req) {
                  try {
                      var p = req.call(el);
                      if (p && p.catch) { p.catch(function () {}); }
                  } catch (e) {}
              }
              if (screen.orientation && screen.orientation.lock) {
                  try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
              }
          };
          document.addEventListener('touchend', kkGoImmersive, { once: true, passive: true });
          document.addEventListener('click', kkGoImmersive, { once: true });
      }

      // Banner "Install" di HP: kalau Kouseikan dipasang ke homescreen (bukan
      // dibuka sebagai tab browser biasa), Android/iOS akan membuka langsung
      // fullscreen + landscape (sesuai manifest.json) TANPA perlu sentuhan apa
      // pun lagi setiap kali dibuka. Tap biasa (lihat kkGoImmersive di atas)
      // adalah batas maksimal untuk tab browser biasa; install adalah satu-
      // satunya cara mendapat fullscreen+landscape otomatis sejak awal.
      if (window.matchMedia('(pointer: coarse)').matches) {
          var kkStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                              window.navigator.standalone === true;
          var kkDismissed = false;
          try { kkDismissed = localStorage.getItem('kkInstallDismissed') === '1'; } catch (e) {}

          if (!kkStandalone && !kkDismissed) {
              var kkIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

              var kkShowBanner = function (message, buttonLabel, onButton) {
                  if (document.getElementById('kkInstallBanner')) { return; }
                  var banner = document.createElement('div');
                  banner.id = 'kkInstallBanner';
                  banner.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2000;' +
                      'display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;' +
                      'background:#241b2ff2;color:#ead5e9;font:13px/1.4 system-ui,sans-serif;' +
                      'box-shadow:0 8px 30px rgba(0,0,0,.4);border:1px solid rgba(167,131,182,.35)';

                  var text = document.createElement('span');
                  text.style.cssText = 'flex:1';
                  text.textContent = message;

                  var btn = document.createElement('button');
                  btn.type = 'button';
                  btn.textContent = buttonLabel;
                  btn.style.cssText = 'border:none;border-radius:8px;background:#7b69ac;color:#fff;' +
                      'padding:8px 14px;font:inherit;font-weight:600;white-space:nowrap;flex-shrink:0';

                  var closeBtn = document.createElement('button');
                  closeBtn.type = 'button';
                  closeBtn.setAttribute('aria-label', 'Tutup');
                  closeBtn.textContent = '✕';
                  closeBtn.style.cssText = 'border:none;background:transparent;color:#ead5e9;' +
                      'font-size:16px;padding:4px 6px;opacity:.7;flex-shrink:0';

                  var kkDismiss = function () {
                      try { localStorage.setItem('kkInstallDismissed', '1'); } catch (e) {}
                      if (banner.parentNode) { banner.parentNode.removeChild(banner); }
                  };

                  btn.addEventListener('click', function () { onButton(kkDismiss); });
                  closeBtn.addEventListener('click', kkDismiss);

                  banner.appendChild(text);
                  banner.appendChild(btn);
                  banner.appendChild(closeBtn);
                  document.body.appendChild(banner);
              };

              if (kkIOS) {
                  // Safari iOS tidak punya API untuk memicu "Add to Home Screen"
                  // secara otomatis; cuma bisa dipandu lewat tombol Bagikan.
                  setTimeout(function () {
                      kkShowBanner(
                          'Pasang Kouseikan: ketuk tombol Bagikan lalu "Add to Home Screen" supaya main fullscreen landscape.',
                          'Mengerti',
                          function (dismiss) { dismiss(); }
                      );
                  }, 3000);
              } else {
                  var kkDeferredInstall = null;
                  window.addEventListener('beforeinstallprompt', function (e) {
                      e.preventDefault();
                      kkDeferredInstall = e;
                      setTimeout(function () {
                          kkShowBanner(
                              'Pasang Kouseikan supaya langsung fullscreen landscape tiap dibuka.',
                              'Install',
                              function (dismiss) {
                                  if (!kkDeferredInstall) { dismiss(); return; }
                                  kkDeferredInstall.prompt();
                                  kkDeferredInstall.userChoice.finally(function () {
                                      kkDeferredInstall = null;
                                      dismiss();
                                  });
                              }
                          );
                      }, 3000);
                  });
                  window.addEventListener('appinstalled', function () {
                      var el = document.getElementById('kkInstallBanner');
                      if (el && el.parentNode) { el.parentNode.removeChild(el); }
                  });
              }
          }
      }
  </script>
