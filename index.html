  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }

    body, html {
      overscroll-behavior: none;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 5px 5px;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0px 0px 5px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #ffffff;
      opacity: 1.0;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1.0;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #666666;
      color: #ffffff
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Paksa tampilan landscape di HP (layar sentuh) saat device masih dipegang
       portrait, dengan merotasi seluruh halaman 90 derajat. Begitu pemain
       memutar HP-nya ke landscape, media query ini tidak aktif lagi dan
       halaman tampil normal (tanpa rotasi) karena orientation sudah landscape. */
    @media (pointer: coarse) and (orientation: portrait) {
      html {
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 0;
        left: 100%;
        transform-origin: 0 0;
        transform: rotate(90deg);
        overflow: hidden;
      }
    }

  </style>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <div id="overlayDiv"></div>

  <!-- KK_VIEW_START -->
<div id="presplash" hidden></div>
<main id="kkBoot" class="kk-boot" data-state="studio" aria-label="Memulai Kouseikan">
  <section class="kk-loading" aria-label="Memuat Kouseikan">

    <svg class="kk-thread" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M-70 711C122 500 299 949 496 708S909 86 1124 238S1131 746 1497 591"/><path class="kk-thread-faint" d="M-56 740C197 521 300 990 520 741S961 87 1150 273S1180 775 1490 626"/></svg>
    <span class="kk-spark kk-spark-one" aria-hidden="true">✦</span><span class="kk-spark kk-spark-two" aria-hidden="true">✧</span>
    <div class="kk-scrap kk-scrap-back" aria-hidden="true"></div>
    <article class="kk-paper">
      <span class="kk-tape" aria-hidden="true"></span>
      <span class="kk-holes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <p class="kk-eyebrow">SEBUAH CERITA DARI ZZZ</p>
      <h1>Kouseikan<span class="kk-title-flower" aria-hidden="true">✽</span></h1>
      <div class="kk-title-rule" aria-hidden="true"><span></span>✦<span></span></div>

    </article>
    <svg class="kk-campus" viewBox="0 0 1440 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 169H1440M76 169v-50h108v50m-80-35h13m12 0h13m12 0h13m143 35V74h116v95m-91-76h13m12 0h13m12 0h13m-63 26h13m12 0h13m12 0h13M471 169V109h92V53h45v116m-36-80h27m-14-25v15m-49 51h15m-15 17h15m76 22v-70h132v70m-105-52h18m16 0h18m16 0h18m-87 21h18m16 0h18m16 0h18m106 31V80h90v89m-67-68h16m15 0h16m-47 24h16m15 0h16m77 44V52h116v117m-91-93h16m18 0h16m-50 25h16m18 0h16m-50 25h16m18 0h16m81 43v-65h110v65m-83-45h17m15 0h17m-49 23h17m15 0h17m86 22v-44h98v44"/></svg>
  </section>
  <button id="kkStudioIntro" class="kk-studio" type="button" aria-label="Zzz studio. Lewati animasi pembuka">

  </button>
</main>

<!-- KK_VIEW_END -->

  <div id="ContextContainer">
    <a id="ContextButton">&#8801;</a><br />
    <div id="ContextMenu" style="display: none;">
      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style=display:none></input>

      </span>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" value="0" max="100"></progress>
  </div>

  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>
  </div>

  <script>
      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip';

      // Register the service worker.
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' });
          }
      }

      // Di HP: begitu pemain menyentuh layar pertama kali (biasanya untuk mulai
      // membaca dialog), masuk ke mode fullscreen + kunci landscape sekalian.
      // Browser melarang fullscreen/orientation-lock otomatis tanpa sentuhan
      // pemain, jadi ini dipasang di sentuhan PERTAMA supaya terasa otomatis.
      if (window.matchMedia('(pointer: coarse)').matches) {
          var kkGoImmersive = function () {
              var el = document.documentElement;
              var req = el.requestFullscreen || el.webkitRequestFullscreen ||
                        el.mozRequestFullScreen || el.msRequestFullscreen;
              if (req) {
                  try {
                      var p = req.call(el);
                      if (p && p.catch) { p.catch(function () {}); }
                  } catch (e) {}
              }
              if (screen.orientation && screen.orientation.lock) {
                  try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
              }
          };
          document.addEventListener('touchend', kkGoImmersive, { once: true, passive: true });
          document.addEventListener('click', kkGoImmersive, { once: true });
      }
  </script>
